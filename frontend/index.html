<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Template - Modern Design</title>
    <style>
        /* ตั้งค่าพื้นฐาน */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 10px;
        }

        h3 {
            font-size: 18px;
            margin: 25px 0 15px 0;
            color: #34495e;
        }

        /* จัดแต่งส่วนฟอร์ม */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #3498db;
        }

        /* ปุ่มกด */
        .btn-submit {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-delete:hover {
            background-color: #c0392b;
        }

        /* การจัดวาง Card แสดงข้อมูล */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background-color: #fafbfc;
            border: 1px solid #e1e4e8;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-content h4 {
            font-size: 16px;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .card-content p {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ระบบจัดการข้อมูล</h2>
        
        <div class="form-group">
            <input type="text" id="titleInput" placeholder="กรอกหัวข้อ...">
            <input type="text" id="detailInput" placeholder="กรอกรายละเอียด...">
            <button class="btn-submit" onclick="sendData()">บันทึกข้อมูล</button>
        </div>

        <h3>รายการทั้งหมด</h3>
        <div id="displayArea" class="card-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
